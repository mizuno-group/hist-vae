[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histvae"
version = "0.1.0"
description = "a package for extracting point cloud and histogram based representations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tadahaya Mizuno" }
]
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "matplotlib",
  "tqdm",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/mizuno-group/hist-vae"
Repository = "https://github.com/mizuno-group/hist-vae"

[project.scripts]
histvae = "histvae.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["histvae*"]

[tool.setuptools.package-data]
histvae = ["config.yaml"]


[tool.pytest.ini_options]
markers = [
  "smoke: lightweight tests that should run in regular CI",
  "slow: heavier end-to-end tests including actual pretrain/finetune runs",
]
